name: macOS preview
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tamayura-macos
          path: |
            dist/*/Tamayura-*-macos.zip
            dist/*/SHA256SUMS-macos
