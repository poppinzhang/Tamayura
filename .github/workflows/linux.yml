name: Linux preview
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # Tray and discovery tests must not be skipped for a missing service.
      TAMAYURA_LINUX_TESTS_NO_SKIP: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-14-dev \
            libavahi-client-dev avahi-daemon dbus desktop-file-utils libglib2.0-bin \
            shared-mime-info binutils xvfb xauth
          sudo systemctl start avahi-daemon
      # Flutter publishes Linux SDK archives for x64 only; both architectures
      # use the same tagged checkout, which downloads its own engine artifacts.
      - name: Install Flutter 3.47.6
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Check Linux toolchain
        run: |
          flutter config --no-analytics
          flutter doctor -v
      - name: Verify and build Linux ${{ matrix.arch }}
        run: scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tamayura-linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/*/Tamayura-*-linux-${{ matrix.arch }}.tar.gz
            dist/*/SHA256SUMS-linux-${{ matrix.arch }}
