  <title id="title">響 — macOS white knockout</title>
  <desc id="desc">White rounded square with a genuinely transparent character cutout and transparent outer corners. The slightly enlarged glyph improves legibility at status-bar sizes. The asset contains a single compound path; there is no opaque character background. 響 (U+97FF), outlined directly from Nagino Medium. Font source: https://github.com/amazusa/Nagino . No font installation or external assets required.</desc>
