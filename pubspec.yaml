name: tamayura
description: 局域网中的随身相册。Android、macOS 与 Windows 媒体共享应用。
publish_to: none
version: 0.9.6+15

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  crypto: ^3.0.7
  grpc: ^4.0.4
  protobuf: ^4.1.0
  fixnum: ^1.1.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.4.3
  path: ^1.9.1
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  package_info_plus: ^9.0.1
  lucide_icons_flutter: ^4.0.1
  flutter_animate: ^4.5.2
  material_ui: ^1.8.0
  animations: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  protoc_plugin: ^22.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - LICENSE

# Windows ships SQLite with the app through Dart native assets. Other hosts
# retain their system SQLite for tests; Android/macOS use the sqflite plugin.
hooks:
  user_defines:
    sqlite3:
      source:
        windows: sqlite3
        default: system
