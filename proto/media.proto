syntax = "proto3";

package tamayura.v1;

// Protocol v4. Keep the service path so GetIdentity can reject older peers.
service MediaLibrary {
  rpc GetIdentity(Empty) returns (DeviceIdentity);
  rpc ListMediaPage(CatalogRequest) returns (CatalogResponse);
  rpc GetThumbnail(ThumbnailRequest) returns (ThumbnailResponse);
  rpc ReadFile(ReadRequest) returns (stream FileChunk);
}

message Empty {}

message DeviceIdentity {
  string id = 1;
  string name = 2;
  uint32 protocol_version = 3;
}

message MediaEntry {
  string id = 1;
  string name = 2;
  string mime_type = 3;
  int64 size = 4;
  int64 modified_ms = 5;
  reserved 6; // The version 1 inline thumbnail field must never be reused.
  string shared_folder_id = 7;
  string shared_folder_name = 8;
  // Slash-separated path relative to the shared root, including the filename.
  string relative_path = 9;
}

message CatalogRequest {
  string revision = 1;
  string page_token = 2;
  uint32 page_size = 3;
  string known_revision = 4;
}

message CatalogResponse {
  string revision = 1;
  repeated MediaEntry items = 2;
  string next_page_token = 3;
  uint32 total_count = 4;
  bool not_modified = 5;
}

message ThumbnailRequest {
  string revision = 1;
  string id = 2;
}

message ThumbnailResponse {
  string revision = 1;
  string id = 2;
  bytes data = 3;
}

message ReadRequest {
  string id = 1;
  int64 offset = 2;
  // At most 8 MiB. Receivers request a larger range one window at a time, so
  // a source never queues more than one window per stream in memory.
  int64 length = 3;
}

message FileChunk {
  int64 offset = 1;
  bytes data = 2;
}
