name: flutter_tailscale
description: Per-application embedded Tailscale nodes and authenticated TCP transport.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
  async: ^2.13.0
  crypto: ^3.0.7
  ffi: ^2.1.4
  grpc: 4.2.0
  http2: ^2.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  plugin:
    platforms:
      android:
        package: dev.fluttertailscale
        pluginClass: FlutterTailscalePlugin
